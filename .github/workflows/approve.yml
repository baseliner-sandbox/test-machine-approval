name: bot-approve
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to approve as github-actions[bot]
        required: true
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: gh pr review "$PR" --approve --body "bot approval test" -R "$GITHUB_REPOSITORY"
